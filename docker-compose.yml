services:
  db:
    image: pgvector/pgvector:pg16
    container_name: campusos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusos}
      POSTGRES_DB: ${POSTGRES_DB:-campusos}
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - campusos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusos}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  campusos_pgdata:
